# 借用本仓的 CRATES_TOKEN 发布 jeffkit/tunely 的 Rust 客户端。
#
# tunely 仓自身未配置 crates.io secret；本 workflow 是它的发布通道：
# 手动触发（workflow_dispatch），checkout tunely main → 跑测试 → cargo publish。
# "already exists" 视为幂等重跑，不算失败。
name: publish-tunely-rust

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish tunely to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jeffkit/tunely

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        working-directory: rust
        run: cargo test

      - name: Publish to crates.io
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          set -uo pipefail
          # ${VAR:-} 而非 $VAR：set -u 下变量完全未定义会直接报 unbound variable 退出，
          # 那就不满足「无 token 只告警不失败」的语义了。
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::warning::Secret CRATES_TOKEN is not set — crates.io publish skipped."
            exit 0
          fi
          # 版本号从被发布的 rust/Cargo.toml 实时读取，不硬编码（避免提示文本过时）
          version=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "Publishing tunely v${version} to crates.io..."
          out=$(cargo publish 2>&1) && { echo "$out"; exit 0; }
          if echo "$out" | grep -q "already exists"; then
            echo "tunely v${version} already published — skipping."
            exit 0
          fi
          echo "$out"
          exit 1
