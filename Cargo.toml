[package]
name = "im-agentproc"
version = "0.1.1"
edition = "2021"
description = "IM-side runtime for the agentproc ecosystem: bridge an IM transport (iLink/WeChat today) to local coding CLIs (Claude Code, Codex, …) via agentproc profiles."
license = "MIT"
authors = ["jeffkit <bbmyth@gmail.com>"]
repository = "https://github.com/jeffkit/im-agentproc"
homepage = "https://github.com/jeffkit/im-agentproc"
keywords = ["agentproc", "im", "bridge", "ilink", "wechat"]
categories = ["web-programming", "network-programming"]

default-run = "im-agentproc"

[[bin]]
name = "im-agentproc"
path = "src/bin/im-agentproc.rs"

[lib]
name = "im_agentproc"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["time"] }

# HTTP client — rustls avoids OpenSSL dep, simplifies cross-compilation
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_norway = "0.9.42"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
dirs = "5"
url = "2"

# QR code display in terminal (pairing flow)
qrcode = { version = "0.14", features = ["svg"] }

futures-util = "0.3"

# AgentProc SDK — protocol layer (turn object, NDJSON events, run()).
# Published to crates.io (0.11+); previously a git rev pin.
agentproc = "0.11.1"

[dev-dependencies]
tempfile = "3"
temp-env = "0.3"
mockito = "1.7.2"
tokio-test = "0.4"
axum = { version = "0.8", features = ["macros", "ws"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
